appId: com.alohamora.app
productName: Alohamora
copyright: Copyright © 2026 Alohamora contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
npmRebuild: false          # sharp / uiohook-napi / tesseract ship prebuilt N-API binaries
# A package unpacked from the asar resolves its own require()s next to it, so its whole dependency closure must be
# unpacked too (otherwise: "Cannot find module 'regenerator-runtime/runtime'"). Regenerate the list with
# `node scripts/asar-unpack-list.mjs` after changing sharp / uiohook-napi / tesseract.js.
asarUnpack:
  - node_modules/@img/**/*
  - node_modules/bmp-js/**/*
  - node_modules/detect-libc/**/*
  - node_modules/idb-keyval/**/*
  - node_modules/is-url/**/*
  - node_modules/node-fetch/**/*
  - node_modules/node-gyp-build/**/*
  - node_modules/opencollective-postinstall/**/*
  - node_modules/regenerator-runtime/**/*
  - node_modules/semver/**/*
  - node_modules/sharp/**/*
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/tr46/**/*
  - node_modules/uiohook-napi/**/*
  - node_modules/wasm-feature-detect/**/*
  - node_modules/webidl-conversions/**/*
  - node_modules/whatwg-url/**/*
  - node_modules/zlibjs/**/*
extraResources:            # common to every OS
  - from: resources/tessdata
    to: tessdata
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

# ---------- Windows ----------
win:
  icon: build/icon.png
  extraResources:
    - from: resources/bin/win32-x64
      to: bin
    - from: resources/tray.png
      to: tray.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: build/installer.nsh
portable:
  artifactName: ${productName}-${version}-portable.exe

# ---------- macOS ----------
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # identity: '-'          # uncomment for ad-hoc signing when you have no Developer ID (see Task 13.6)
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
  fileAssociations:        # Finder "Open With → Alohamora" without stealing the default app
    - { ext: [jpg, jpeg, png, webp, heic, heif, tif, tiff, svg, avif, bmp], name: Image, role: Viewer, rank: Alternate }
    - { ext: [mp3, m4a, wav, flac, ogg, opus, aiff, aif, wma], name: Audio, role: Viewer, rank: Alternate }
    - { ext: [mp4, m4v, mov, mkv, webm, avi, wmv, gif], name: Video, role: Viewer, rank: Alternate }
    - { ext: [pdf, epub, txt, md, srt, vtt], name: Document, role: Viewer, rank: Alternate }
  extendInfo:
    LSMultipleInstancesProhibited: true
dmg:
  sign: false

# ---------- Linux ----------
linux:
  icon: build/icon.png
  category: Utility
  executableName: alohamora
  synopsis: Offline file converter
  target: [AppImage, deb]
  extraResources:
    - from: resources/bin/linux-${arch}
      to: bin
    - from: resources/tray.png
      to: tray.png
  mimeTypes:               # "Open With → Alohamora" in GNOME/KDE (not default)
    - image/jpeg
    - image/png
    - image/webp
    - image/heic
    - image/tiff
    - image/svg+xml
    - image/avif
    - image/bmp
    - audio/mpeg
    - audio/mp4
    - audio/x-wav
    - audio/flac
    - audio/ogg
    - audio/x-aiff
    - audio/x-ms-wma
    - video/mp4
    - video/quicktime
    - video/x-matroska
    - video/webm
    - video/x-msvideo
    - video/x-ms-wmv
    - image/gif
    - application/pdf
    - application/epub+zip
    - text/plain
    - application/x-subrip
    - text/vtt
deb:
  depends: [libgtk-3-0, libnss3, libxss1, libxtst6, libnotify4, libgbm1, "libasound2 | libasound2t64"]
